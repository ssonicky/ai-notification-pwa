<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>나의 AI 알림장</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      text-align: center;
    }

    .ai-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 80px;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      resize: none;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .ai-button {
      background: #222;
      color: white;
    }

    .add-button {
      background: white;
      border: 1px solid #ddd;
    }

    .task {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }

    .task-time {
      font-size: 14px;
      color: #777;
    }

    #message {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }

  </style>

</head>


<body>

  <h1>🔔 나의 AI 알림장</h1>


  <div class="ai-box">

    <h2>✨ AI에게 일정 말하기</h2>

    <textarea
      id="aiInput"
      placeholder="예: 내일 오후 3시에 치과 예약">
    </textarea>

    <button
      class="ai-button"
      onclick="addAI()">

      ✨ AI 일정 추가

    </button>

    <div id="message"></div>

  </div>


  <h2>🔴 지금 해야 할 일</h2>

  <div id="urgentTasks">

    <p>일정을 불러오는 중...</p>

  </div>


  <h2>📅 오늘 예정</h2>

  <div id="todayTasks">

    <p>일정을 불러오는 중...</p>

  </div>


  <button
    class="add-button"
    onclick="alert('직접 일정 추가 기능은 다음 단계에서 연결할게요!')">

    ＋ 직접 일정 추가

  </button>


  <script>

    const API_URL =
  "https://script.google.com/macros/s/AKfycbyv35chotd4Ih-dxhWi6q-8kviQwOTYErbWTkbQoUHCKD5EyzJYBpsUL8gMMjNyX8ui2Q/exec";


function addAI() {
  alert("버튼이 눌렸어요!");
  
  const input = document.getElementById("aiInput");
  
  const message =
    document.getElementById("message");

  const text =
    input.value.trim();


  if (!text) {

    message.innerText =
      "일정을 입력해주세요.";

    return;

  }


  message.innerText =
    "🤖 AI가 일정을 분석하고 있어요...";


 fetch(API_URL, {

  method: "POST",

  mode: "no-cors",

  headers: {
    "Content-Type": "text/plain;charset=utf-8"
  },

  body: JSON.stringify({
    action: "addAI",
    text: text
  })

})
.then(function() {

  message.innerText =
    "✅ 일정 추가 요청을 보냈어요!";

  input.value = "";

})
.catch(function(error) {

  message.innerText =
    "❌ 오류: " + error.message;

});
  .then(function(response) {
    return response.json();
  })

  .then(function(data) {

    if (!data.success) {
      throw new Error(data.message);
    }

    message.innerText =
      "✅ 일정이 추가되었습니다! " +
      data.result.date + " " +
      data.result.time +
      " - " +
      data.result.task;

    input.value = "";

  })

  .catch(function(error) {

    message.innerText =
      "❌ 오류: " + error.message;

  });

}
  </script>


</body>

</html>
